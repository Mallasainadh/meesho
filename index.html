<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Meesho - Sign In</title>
    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-light bg-white border-bottom">
        <div class="container-fluid px-5">
            <a class="navbar-brand meesho-logo" href="#">
                meesho
            </a>
            <div class="navbar-text">
                Become a Supplier
            </div>
        </div>
    </nav>
    <!-- Main Section -->
    <main class="signin-section">
        <div class="signin-card">
            <!-- Banner -->
            <div class="banner">
                <div class="products">
                    <img
                        src="https://images.meesho.com/images/marketing/1661417516766.webp"
                        alt="Meesho Products"
                        class="meesho-banner-image"
                    >
                </div>
                <div class="banner-text">
                    <h3>
                        Great Quality
                    </h3>
                    <h3>
                        Lowest prices
                    </h3>
                </div>
            </div>
            <!-- Sign In Form -->
            <div class="form-content">
                <h2>
                    Sign In
                </h2>
                <p class="subtitle">
                    Enter your details to continue
                </p>
                <form>
                    <!-- Mobile Number -->
                    <div class="mb-3">
                        <label
                            for="mobile"
                            class="form-label">
                            Mobile Number
                        </label>
                        <div class="input-group">
                            <span class="input-group-text">
                                +91
                            </span>
                            <input
                                type="tel"
                                id="mobile"
                                class="form-control"
                                placeholder="Enter mobile number"
                                maxlength="10"
                                required
                            >
                        </div>
                    </div>
                    <!-- Password -->
                    <div class="mb-3">
                        <label
                            for="password"
                            class="form-label">
                            Password
                        </label>
                        <input
                            type="password"
                            id="password"
                            class="form-control"
                            placeholder="Enter password"
                            required
                        >
                    </div>
                    <!-- Forgot Password -->
                    <div class="text-end mb-3">
                        <a
                            href="#"
                            class="forgot-link">
                            Forgot Password?
                        </a>
                    </div>
                    <!-- Sign In Button -->
                    <button
                        type="submit"
                        class="btn signin-btn w-100">
                        Sign In
                    </button>
                </form>
                <!-- OR -->
                <div class="divider">
                    <span>
                        OR
                    </span>
                </div>
                <!-- Google Button -->
                <button
                    class="btn google-btn w-100">
                    Continue with Google
                </button>
                <!-- Sign Up -->
                <p class="signup-text">
                    Don't have an account?
                    <a href="#">
                        Sign Up
                    </a>
                </p>
                <!-- Terms -->
                <p class="terms">
                    By continuing, you agree to our
                    <a href="#">
                        Terms & Conditions
                    </a>
                    and
                    <a href="#">
                        Privacy Policy
                    </a>.
                </p>
            </div>
        </div>
    </main>
    <!-- Footer -->
    <footer>

        <p>
            © 2026 Meesho. All rights reserved.
        </p>

    </footer>



    <!-- Bootstrap JS -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


</body>

</html>
